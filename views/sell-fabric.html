<div class="page" id="page-sell-fabric">
  <div>
    <!-- Sell Fabric Form Card -->
    <div class="card">
      <div class="card-header" style="margin-bottom: 16px">
        <div class="card-title">💲 Sell Fabric from Inventory</div>
      </div>
      <form id="sell-fabric-form" novalidate>
        <div class="grid-2" style="gap: 12px">
          <div class="form-group">
            <label>Date <span class="required">*</span></label>
            <input type="date" id="sell-date" />
            <div class="field-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label>Select Fabric <span class="required">*</span></label>
            <select
              id="sell-fabric-select"
              onchange="SellFabricPage.onFabricChange()"
            >
              <option value="">-- Choose Fabric --</option>
            </select>
            <div class="field-error" style="display: none"></div>
          </div>
        </div>
        <div class="grid-2" style="gap: 12px">
          <div class="form-group">
            <label>Cost / Unit Price (THB)</label>
            <input
              type="number"
              id="sell-unit-price"
              step="0.01"
              readonly
              style="
                background-color: var(--bg-input);
                color: var(--text-muted);
              "
            />
          </div>
          <div class="form-group">
            <label
              >Selling Price / Unit (THB) <span class="required">*</span></label
            >
            <input
              type="number"
              id="sell-price-input"
              step="0.01"
              oninput="SellFabricPage.calcTotal()"
            />
            <div class="field-error" style="display: none"></div>
          </div>
        </div>

        <div class="grid-2" style="gap: 12px">
          <div class="form-group">
            <label>Selling Count (Qty) <span class="required">*</span></label>
            <input
              type="number"
              id="sell-qty"
              step="0.01"
              oninput="SellFabricPage.calcTotal()"
              placeholder="e.g. 5.5"
            />
            <div class="field-error" style="display: none"></div>
          </div>
          <div class="form-group">
            <label>Total Amount (THB)</label>
            <input
              type="number"
              id="sell-total"
              step="0.01"
              readonly
              style="
                background-color: var(--bg-input);
                font-weight: bold;
                color: var(--text-gold);
              "
            />
          </div>
        </div>

        <div style="margin-top: 16px; display: flex; justify-content: flex-end">
          <button type="button" class="btn btn-gold" id="btn-save-sell-fabric">
            💸 Record Fabric Sale
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fabric Sell History Card -->
  <div class="card" style="margin-top: 20px">
    <div class="card-header" style="margin-bottom: 16px">
      <div class="card-title">📜 Fabric Sell History</div>
      <div
        class="search-input-wrap"
        style="max-width: 280px; margin-left: auto"
      >
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="fabric-sales-search"
          placeholder="Search sales history…"
        />
      </div>
    </div>
    <div class="order-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Fabric</th>
            <th>Color</th>
            <th class="text-right">Qty Sold</th>
            <th class="text-right">Cost Price</th>
            <th class="text-right">Sell Price</th>
            <th class="text-right">Total Amount</th>
          </tr>
        </thead>
        <tbody id="fabric-sales-tbody">
          <tr>
            <td colspan="8" class="table-empty">No sales recorded yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="fabric-sales-pagination"></div>
  </div>
</div>
